<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Long-text Question Search powered by C++ BM25">
<title>Long-text Question Search</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="./style.css">
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
<div class="mx-auto max-w-6xl px-4 py-8 sm:px-6 lg:py-12">
<header class="mb-8">
  <div class="inline-flex rounded-full border border-cyan-400/20 bg-cyan-400/10 px-3 py-1 text-xs font-semibold text-cyan-300">C++ BM25 · FastAPI</div>
  <h1 class="mt-4 text-3xl font-black tracking-tight sm:text-5xl">Long-text Question Search</h1>
  <p class="mt-3 max-w-3xl text-sm leading-6 text-slate-400 sm:text-base">Dán nguyên đề bài dài. Hệ thống chuẩn hóa văn bản, xếp hạng bằng BM25 và tạo Chrome Text Fragment để mở đúng vị trí trên trang nguồn.</p>
</header>

<section class="rounded-3xl border border-slate-800 bg-slate-900/80 p-4 shadow-2xl sm:p-6">
  <label for="query" class="text-sm font-bold text-slate-200">Đề bài / văn bản cần tìm</label>
  <textarea id="query" rows="10" maxlength="100000"
    class="mt-3 w-full resize-y rounded-2xl border border-slate-700 bg-slate-950 p-4 text-sm leading-6 text-slate-100 outline-none transition focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20"
    placeholder="Dán đoạn văn bản dài tại đây..."></textarea>
  <div class="mt-4 flex flex-col gap-3 sm:flex-row">
    <button id="pasteBtn" class="rounded-xl border border-slate-700 px-5 py-3 text-sm font-bold hover:bg-slate-800">Dán từ bộ nhớ tạm</button>
    <button id="clearBtn" class="rounded-xl border border-slate-700 px-5 py-3 text-sm font-bold hover:bg-slate-800">Xóa</button>
    <button id="searchBtn" class="rounded-xl bg-cyan-400 px-6 py-3 text-sm font-black text-slate-950 hover:bg-cyan-300 disabled:cursor-not-allowed disabled:opacity-50">Tìm kiếm ngay</button>
  </div>
  <p id="status" class="mt-3 min-h-5 text-xs text-slate-500"></p>
</section>

<section class="mt-7">
  <div class="mb-4 flex items-center justify-between">
    <h2 class="text-lg font-bold">Kết quả</h2>
    <span class="text-xs text-slate-500">Top 5</span>
  </div>
  <div id="results" class="space-y-4"></div>
</section>
</div>
<script src="./app.js"></script>
</body>
</html>
